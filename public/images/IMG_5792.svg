<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff6db" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#44b0e4" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13c68b" />
      <stop offset="100%" stop-color="#44b0e4" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" rx="40" fill="url(#grad3)" />
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6f44e4" stroke-width="1" stroke-opacity="0.05" />
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" rx="40" />
  
  <!-- Main Objects -->
  <g filter="url(#shadow2)">
    <!-- Abstract Book / Tablet -->
    <rect x="200" y="150" width="400" height="300" rx="20" fill="#ffffff" />
    <rect x="230" y="180" width="340" height="240" rx="12" fill="#f8f9fa" />
    
    <!-- Play/Video Icon (representing engaging content) -->
    <circle cx="400" cy="300" r="40" fill="url(#grad4)" />
    <path d="M 390 280 L 420 300 L 390 320 Z" fill="#ffffff" />
    
    <!-- Elements -->
    <rect x="120" y="350" width="140" height="120" rx="24" fill="#6f44e4" opacity="0.9" />
    <circle cx="190" cy="410" r="30" fill="#ffffff" opacity="0.2" />
    
    <rect x="550" y="100" width="160" height="180" rx="24" fill="#ffc107" opacity="0.9" />
    <path d="M 590 190 Q 630 150 670 190" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
</svg>
